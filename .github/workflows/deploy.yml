name: Build and deploy

on:
  push:
    branches: [master]
    # A quiet-day run commits only the scan log; nothing to rebuild for.
    paths-ignore:
      - 'data/last-run.md'
  # promote-desk.yml pushes to master using GITHUB_TOKEN, and GitHub deliberately does not fire
  # workflows for such pushes — a loop guard. Without this the desk's work reaches master and the
  # site never rebuilds, which looks exactly like a successful publish that nobody can see.
  workflow_run:
    workflows: ["Promote desk branch"]
    types: [completed]
  workflow_dispatch:

# Requires Settings → Pages → Source = "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # On a workflow_run trigger, only deploy if the promotion actually succeeded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate the daily job runs locally. A malformed or unsourced post fails the
      # deploy rather than reaching the live site.
      - name: Validate content
        run: node scripts/validate-posts.mjs

      - uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
