name: Daily scan

# The morning desk. Runs the same .claude/skills/daily-scan/SKILL.md a local
# /daily-scan invocation would, then commits whatever it wrote.
#
# This lives in CI rather than in a Claude cloud routine for one reason:
# observability. GITHUB_TOKEN has push rights by construction, and every step
# leaves a log — so when a source adapter rots or the desk decides to publish
# nothing, the reason is readable here instead of having to be inferred.

on:
  schedule:
    # 05:04 UTC ≈ 07:04 Prague in summer, 06:04 in winter. Cron is UTC-only.
    - cron: '4 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-back window for the scan, in days'
        required: false
        default: '21'
      dry_run:
        description: 'Scan and write, but do not commit'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          # Deep enough to rebase if the branch moved while the desk was writing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Run the scan as its own step so the source counts land in the log
      # verbatim. If every source returns zero here, the problem is network
      # egress or rotted selectors — not the desk's judgement.
      - name: Scan sources
        id: scan
        run: node scripts/ingest.mjs --days "${{ inputs.days || '21' }}"

      - name: Summarise the digest
        run: node scripts/digest-summary.mjs

      - name: Write the day's stories
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --print \
            --model claude-opus-5 \
            --permission-mode bypassPermissions \
            --allowedTools Bash Read Write Edit Glob Grep WebFetch WebSearch \
            "Read .claude/skills/daily-scan/SKILL.md and follow it from step 2 onward. \
             Step 1 (the scan) has already run — read .cache/digest.json for the candidates. \
             Do NOT commit or push; the workflow does that. Stop after step 6 (validate and build). \
             Also read CLAUDE.md for the project's non-negotiables. \
             If the digest has no candidates worth publishing, write nothing and say so."

      # The gate. Runs regardless of what the desk believes it did.
      - name: Validate
        run: node scripts/validate-posts.mjs

      - name: Build
        run: npm run build

      - name: Reconcile the seen index
        run: node scripts/mark-covered.mjs

      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet --exit-code content/posts data/seen.json; then
            echo "Nothing written — quiet day, nothing to commit."
            exit 0
          fi
          git config user.name  "Prague Insider Desk"
          git config user.email "desk@pragueinsider.cz"
          git add content/posts data/seen.json
          COUNT=$(git diff --cached --name-only --diff-filter=A \
                  -- 'content/posts/*/index.en.md' | wc -l | tr -d ' ')
          git commit -m "posts: ${COUNT} stories for $(date -u +%F)"
          # The deploy workflow may have pushed while we were writing.
          git pull --rebase origin master
          git push origin HEAD:master
          echo "Pushed ${COUNT} story/stories."
